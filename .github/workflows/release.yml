name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and test artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-x86_64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: windows-2022, target: windows-x86_64}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          version: '0.11.3'
      - run: uv sync --locked --python 3.12 --group bundle
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/check_release.py "$env:RELEASE_TAG"
        if: runner.os == 'Windows' && github.ref_type == 'tag'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/check_release.py "$RELEASE_TAG"
        if: runner.os != 'Windows' && github.ref_type == 'tag'
      - run: uv run --frozen --group bundle python scripts/build_binary.py --target ${{ matrix.target }}
      - name: Test Windows installer
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/test_installers.py
      - name: Build Python packages
        if: matrix.target == 'linux-x86_64'
        run: |
          uv build
          uv run --frozen twine check dist/*
          cp dist/* release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.build_only)
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Prepare checksums and installers
        run: |
          cp install.sh install.ps1 release/
          cd release
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish the tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-notes.md
          gh release upload "$RELEASE_TAG" release/*
          case "$RELEASE_TAG" in
            *rc*|*a[0-9]*|*b[0-9]*) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
          esac
