name: Publish to PyPI
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag whose tested Python artifacts should be published
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/annas-archive-cli
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download tested Python distributions from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern 'annas_archive_cli-*.tar.gz'
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GH_REPO"
          done
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
