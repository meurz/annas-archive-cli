name: Live diagnostics
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Verified mirror origin
        required: true
        default: https://annas-archive.gl
permissions:
  contents: read
jobs:
  doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.3'
      - run: uv sync --locked --no-dev --python 3.12
      - name: Inspect mirror without account credentials
        env:
          ANNA_BASE_URL: ${{ inputs.base_url }}
        run: uv run --frozen --no-dev anna doctor --json
