[project]
name = "annas-archive-cli"
version = "0.1.0"
description = "Search Anna's Archive, inspect records, and download files from the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "click>=8.1,<9", "httpx>=0.27,<1"]

[project.scripts]
anna = "anna.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anna"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
